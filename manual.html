<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAT Toolkit — Manual</title>
<link rel="stylesheet" href="css/styles.css?v=2">
</head>
<body class="manual-page">

<header class="topbar">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">
      <span class="mark-a"></span><span class="mark-b"></span><span class="mark-c"></span>
    </div>
    <div class="brand-text">
      <h1 data-i18n="app.title"></h1>
      <p data-i18n="app.subtitle"></p>
    </div>
  </div>

  <div class="technique-chip">
    <span class="chip-abbr" data-i18n="app.techniqueAbbr"></span>
    <span class="chip-name" data-i18n="app.techniqueName"></span>
  </div>

  <div class="topbar-actions">
    <label class="field-inline">
      <span class="sr-only" data-i18n="nav.language"></span>
      <select id="langSelect" class="select-sm" aria-label="Language"></select>
    </label>
    <a class="btn btn-solid" href="index.html" id="backLink"></a>
    <button class="btn btn-ghost" id="btnPrint" type="button">PDF</button>
  </div>
</header>

<main class="manual-layout">

  <!-- Índice lateral -->
  <nav class="manual-toc" id="toc" aria-label="Contents">
    <p class="panel-title" id="tocTitle"></p>
    <ol id="tocList"></ol>
  </nav>

  <article class="manual-body" id="manualBody">
    <header class="manual-head">
      <h1 id="manualTitle"></h1>
      <p class="manual-subtitle" id="manualSubtitle"></p>
      <p class="manual-intro" id="manualIntro"></p>
    </header>
    <div id="manualSections"></div>
  </article>

</main>

<footer class="footer">
  <span data-i18n="footer.builtWith"></span>
  <span class="sep">•</span>
  <span data-i18n="footer.status"></span>
</footer>

<script src="js/i18n.js?v=2"></script>
<script src="js/manual-content.js?v=2"></script>
<script src="js/manual.js?v=2"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- O <title> é preenchido por app.js a partir das chaves de tradução. -->
<title>SAT Toolkit</title>
<!-- ?v= força o navegador a buscar a versão nova em vez da que tem em cache.
     Ao publicar uma alteração, incrementar o número nas quatro referências. -->
<link rel="stylesheet" href="css/styles.css?v=2">
</head>
<body>

<!-- ===================== BARRA SUPERIOR ===================== -->
<header class="topbar" id="topbar">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">
      <span class="mark-a"></span><span class="mark-b"></span><span class="mark-c"></span>
    </div>
    <div class="brand-text">
      <h1 data-i18n="app.title"></h1>
      <p data-i18n="app.subtitle"></p>
    </div>
  </div>

  <div class="technique-chip">
    <span class="chip-abbr" data-i18n="app.techniqueAbbr"></span>
    <span class="chip-name" data-i18n="app.techniqueName"></span>
  </div>

  <div class="topbar-actions">
    <label class="field-inline">
      <span class="sr-only" data-i18n="nav.language"></span>
      <select id="langSelect" class="select-sm" aria-label="Language"></select>
    </label>

    <button class="btn btn-ghost" id="modeToggle" type="button">
      <span class="dot" aria-hidden="true"></span>
      <span id="modeLabel"></span>
    </button>

    <div class="btn-cluster">
      <button class="btn btn-ghost" id="btnSample"  type="button" data-i18n="nav.sample"></button>
      <button class="btn btn-ghost" id="btnSave"    type="button" data-i18n="nav.save"></button>
      <button class="btn btn-ghost" id="btnLoad"    type="button" data-i18n="nav.load"></button>
      <button class="btn btn-ghost" id="btnReset"   type="button" data-i18n="nav.reset"></button>
    </div>

    <div class="btn-cluster">
      <button class="btn btn-solid" id="btnPdf"   type="button" data-i18n="nav.exportPdf"></button>
      <button class="btn btn-solid" id="btnImage" type="button" data-i18n="nav.exportImage"></button>
    </div>

    <a class="btn btn-ghost" href="manual.html" id="manualLink"></a>
    <button class="btn btn-icon" id="btnAbout" type="button" title="?">?</button>
  </div>
</header>

<!-- ===================== TRILHA DE PASSOS ===================== -->
<nav class="steprail" id="stepRail" aria-label="Steps"></nav>

<!-- ===================== ÁREA PRINCIPAL ===================== -->
<main class="layout">

  <section class="workspace" id="workspace">
    <div class="step-head">
      <div>
        <p class="step-counter" id="stepCounter"></p>
        <h2 class="step-title" id="stepTitle"></h2>
      </div>
      <div class="step-nav">
        <button class="btn btn-ghost" id="btnPrev" type="button" data-i18n="steps.prev"></button>
        <button class="btn btn-solid" id="btnNext" type="button" data-i18n="steps.next"></button>
      </div>
    </div>

    <p class="step-guide" id="stepGuide"></p>

    <!-- Ajuda embutida: a armadilha do passo. Recolhível, para não estorvar
         quem já domina a técnica. O estado fica guardado entre sessões. -->
    <details class="pitfall" id="stepPitfall">
      <summary><span class="pitfall-icon" aria-hidden="true">!</span><span id="pitfallHeading"></span></summary>
      <p id="pitfallText"></p>
    </details>

    <div id="stepBody"></div>
  </section>

  <!-- Painel lateral vivo: acompanha o analista em todos os passos -->
  <aside class="sidepanel" id="sidepanel">
    <section class="panel">
      <h3 class="panel-title" data-i18n="scores.heading"></h3>
      <p class="panel-sub" data-i18n="scores.explain"></p>
      <div id="scoreList"></div>
    </section>

    <section class="panel">
      <h3 class="panel-title" data-i18n="alerts.heading"></h3>
      <div id="alertList"></div>
    </section>
  </aside>

</main>

<footer class="footer">
  <span data-i18n="footer.builtWith"></span>
  <span class="sep">•</span>
  <span data-i18n="footer.status"></span>
</footer>

<!-- ===================== MODAL: SOBRE A TÉCNICA ===================== -->
<div class="modal-backdrop" id="aboutModal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="aboutTitle">
    <header class="modal-head">
      <h2 id="aboutTitle" data-i18n="about.heading"></h2>
      <button class="btn btn-icon" id="aboutClose" type="button">×</button>
    </header>
    <div class="modal-body" id="aboutBody"></div>
  </div>
</div>

<!-- ===================== ÁREA DE IMPRESSÃO (PDF) ===================== -->
<div id="printArea" class="print-only"></div>

<!-- Aviso flutuante -->
<div class="toast" id="toast" hidden></div>

<script src="js/i18n.js?v=2"></script>
<script src="js/ach.js?v=2"></script>
<script src="js/app.js?v=2"></script>
</body>
</html>
